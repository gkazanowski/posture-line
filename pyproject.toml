[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-line"
version = "0.1.0"
description = "Camera preview and body landmark analysis"
requires-python = ">=3.10,<3.13"
dependencies = ["mediapipe>=0.10.14,<0.11", "opencv-contrib-python>=4.10,<5", "PySide6>=6.7,<7"]

[project.scripts]
posture-line = "posture_line.app:main"

[tool.setuptools.packages.find]
where = ["src"]
